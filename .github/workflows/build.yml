name: Build Firmware

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install ARM Toolchain
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build gcc-arm-none-eabi

    - name: Configure CMake (Debug preset, arm-none-eabi toolchain)
      run: cmake --preset Debug

    - name: Build
      run: cmake --build --preset Debug

    - name: Show size
      run: arm-none-eabi-size build/Debug/FalkraDrones.elf
